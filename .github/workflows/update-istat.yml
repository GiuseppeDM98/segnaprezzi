name: Update ISTAT NIC series

# Why a PR and not a push: the refresh replaces the whole series (ISTAT
# revises provisional figures), so a human should glance at the diff before
# it lands on main.
on:
  schedule:
    - cron: '0 6 20 * *' # monthly, after ISTAT's mid-month final release
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh data/istat-nic.json
        run: pnpm istat:update

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh ISTAT NIC series'
          title: 'chore: refresh ISTAT NIC series'
          branch: chore/update-istat-nic
