name: Feature request
description: Propose a new feature or a change in behavior
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is the right place to propose and discuss an idea first — if it's
        accepted, the next step is typically implementing it (which you're welcome to do
        yourself).

        Check the **Non-goals** and **Roadmap** sections of the [README](https://github.com/GiuseppeDM98/segnaprezzi#readme)
        first: they may already answer whether the idea fits now, later, or never. Not
        sure it's concrete enough for an issue yet? Start a
        [Discussion](https://github.com/GiuseppeDM98/segnaprezzi/discussions) instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Describe the situation, not the solution — "as a user tracking fuel prices, I can't…".
      placeholder: When I buy the same product at two different stores in the same month, I can't see which store is cheaper over time.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you solve it? Concrete details welcome — affected routes, screens, data — but a rough sketch is fine too.
      placeholder: Add a per-store breakdown to the product detail page (/products/[id]), one line per store on the price history chart.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you set them aside. "None" is an acceptable answer.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Willingness to contribute
      description: No obligation either way — this just helps with planning.
      options:
        - I'd like to implement it myself
        - I'd like to implement it once the approach is agreed
        - I could help with parts (tests, translations, review)
        - I'm proposing the idea only
    validations:
      required: true
