<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="segnaprezzi logo: a price tag with a rising line printed as dots">
  <!-- Price tag: a rounded square rotated 45deg, with a punched hole at the top
       vertex. The hole is cut with a mask (not painted) so the logo works on
       any background, light or dark. Colors are the light-theme accent
       (highlighter orange) and ribbon ink of src/app/globals.css; the in-app
       twin is src/components/ui/logo-mark.tsx, which reads the theme tokens. -->
  <defs>
    <mask id="tag-hole">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="17.5" r="3.6" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#tag-hole)">
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#DB640E" transform="rotate(45 32 32)"/>
  </g>
  <!-- A rising line printed one dot at a time (the dot-matrix voice). -->
  <g fill="#1E1B24">
    <circle cx="20.5" cy="41" r="2.4"/>
    <circle cx="26" cy="36" r="2.4"/>
    <circle cx="31.5" cy="38.5" r="2.4"/>
    <circle cx="37" cy="32" r="2.4"/>
    <circle cx="42.5" cy="26.5" r="2.4"/>
    <circle cx="37.5" cy="25.5" r="1.7"/>
    <circle cx="43.5" cy="31.5" r="1.7"/>
  </g>
</svg>
