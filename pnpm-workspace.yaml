allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: false
  unrs-resolver: false

# Dev-only transitive packages pinned below their patched versions by their
# parents (vitest, @serwist/utils, @esbuild-kit): see docs/guide/dipendenze.md.
overrides:
  vite: "^8.3.5"
  browserslist: "^4.29.4"
  "esbuild@<0.24.3": "^0.25.12"
  # @serwist/build and @serwist/next pin glob 13.0.6 exactly, also in 9.5.13:
  # moderate advisories GHSA-3g3m-2fjr-6pw4 (glob) and GHSA-g3hv-75wg-m249
  # (minimatch). Build-time only; see docs/guide/dipendenze.md.
  glob: "14.0.3"
  minimatch: "11.0.3"
